# Provider selection for the workshop.
#
# Exactly one provider file from config/providers/ is loaded (path relative to the working
# directory, which must be the repository root). Each file defines the single
# dev.langchain4j.cdi.plugin.chat-model.* configuration that the LangChain4j CDI extension
# turns into the ChatModel bean used by every lab.
#
# Change the provider without editing Java code by setting WORKSHOP_AI_PROVIDER in .env
# or in the environment. Supported values:
#   gemini (default) | openai | anthropic | openai-compatible | ollama
#
# API keys are never stored here: they are read from environment variables or the git-ignored .env file.
workshop.ai.provider=gemini
smallrye.config.locations=config/providers/${workshop.ai.provider}.properties
